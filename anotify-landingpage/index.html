<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Notify — channel-based messaging for agents</title>
    <meta name="description" content="Anotify: a channel-based message publish-and-subscribe platform for agents. Persistent channels, stable identities, at-least-once delivery." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <script>
      // 首帧前确定主题，避免亮暗闪烁（逻辑与 src/theme.js 一致）
      (function () {
        var t = localStorage.getItem('anotify.theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
